<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人首頁 | Personal Page</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 90%; text-align: center; }
    h1 { color: #1e293b; margin-bottom: 10px; }
    p { color: #64748b; font-size: 14px; }
    .btn-group { margin: 20px 0; display: flex; gap: 10px; justify-content: center; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    button:hover { background: #2563eb; }
    #info-box { display: none; background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 6px; margin-top: 15px; color: #1e40af; text-align: left; }
    #quote-area { margin-top: 15px; padding: 10px; background: #fafafa; border-left: 4px solid #3b82f6; font-style: italic; color: #475569; text-align: left; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Web Lab 2 個人首頁</h1>
    <p>結合 HTML5、CSS 與 jQuery 動態交互展示</p>

    <div class="btn-group">
      <button id="toggle-btn">展開 / 收合簡介 (jQuery)</button>
      <button id="ajax-btn">取得名言 (jQuery Ajax)</button>
    </div>

    <div id="info-box">
      <strong>關於本專案：</strong>
      <p>本頁面透過 jQuery 實作滑動動畫，並使用 jQuery $.ajax() 向公開 API 請求 JSON 資料完成非同步局部更新。</p>
    </div>

    <div id="quote-area">點擊上方按鈕載入資料...</div>
  </div>

  <script>
    $(document).ready(function() {
      // 1. jQuery 滑動動態效果
      $("#toggle-btn").click(function() {
        $("#info-box").slideToggle(200);
      });

      // 2. jQuery Ajax 獲取 JSON 資料
      $("#ajax-btn").click(function() {
        $("#quote-area").text("載入中...");
        $.ajax({
          url: "https://api.adviceslip.com/advice",
          type: "GET",
          dataType: "json",
          success: function(res) {
            $("#quote-area").hide().text('"' + res.slip.advice + '"').fadeIn(300);
          },
          error: function() {
            $("#quote-area").text("無法載入資料，請稍後再試。");
          }
        });
      });
    });
  </script>
</body>
</html>
